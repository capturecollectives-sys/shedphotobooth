name: Codex Apply SEO Updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-apply-seo-updates.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved SEO updates
        run: |
          python <<'PY'
          from pathlib import Path
          import json, re

          SITE = "https://shedphotobooth.capturecollectives.workers.dev"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding="utf-8")

          def replace_head(html, lead):
              if "<style>" in html.split("</head>", 1)[0]:
                  return re.sub(r"<head>[\s\S]*?<style>", "<head>\n" + lead + "\n  <style>", html, count=1)
              return re.sub(r"<head>[\s\S]*?</head>", "<head>\n" + lead + "\n</head>", html, count=1)

          def analytics(html):
              if "js/analytics.js" in html:
                  return html
              return html.replace("</body>", '<script src="js/analytics.js"></script>\n</body>', 1)

          org = {
              "@type": "Organization",
              "@id": f"{SITE}/#organization",
              "name": "Shed Photobooth",
              "legalName": "Capture Collective Ltd",
              "url": f"{SITE}/",
              "logo": f"{SITE}/images/logo-white.png",
              "email": "capturecollectives@gmail.com",
              "areaServed": ["Scotland", "United Kingdom"],
              "sameAs": []
          }
          home_schema = {
              "@context": "https://schema.org",
              "@graph": [
                  org,
                  {"@type": "WebSite", "@id": f"{SITE}/#website", "url": f"{SITE}/", "name": "Shed Photobooth", "publisher": {"@id": f"{SITE}/#organization"}, "inLanguage": "en-GB"},
                  {"@type": "Service", "@id": f"{SITE}/#photobooth-hire", "name": "Photobooth hire for events", "serviceType": "Photobooth hire", "provider": {"@id": f"{SITE}/#organization"}, "areaServed": ["Scotland", "United Kingdom"], "description": "Custom-built photobooth hire for festivals, weddings, Christmas markets, corporate events, sports events and brand activations across Scotland and the UK.", "offers": {"@type": "Offer", "availability": "https://schema.org/InStock", "url": f"{SITE}/contact.html"}},
                  {"@type": "FAQPage", "@id": f"{SITE}/#faqs", "mainEntity": [
                      {"@type": "Question", "name": "Do you offer photobooth hire outside Scotland?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Shed Photobooth is based in Scotland and available for events across the UK."}},
                      {"@type": "Question", "name": "What events do you cover?", "acceptedAnswer": {"@type": "Answer", "text": "We cover festivals, weddings, Christmas markets, corporate events, sports events, private parties and brand activations."}},
                      {"@type": "Question", "name": "Can the photobooth be branded for our event?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Every booth, welcome screen and print layout can be designed to match the event, venue or brand identity."}}
                  ]}
              ]
          }

          home_lead = f'''  <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="Photobooth hire in Scotland and across the UK for festivals, weddings, corporate events, Christmas markets and brand activations. Custom-built booths, instant prints and on-site support.">
            <meta name="robots" content="index,follow">
            <meta name="author" content="Capture Collective Ltd">
            <link rel="canonical" href="{SITE}/">
            <meta property="og:type" content="website">
            <meta property="og:site_name" content="Shed Photobooth">
            <meta property="og:title" content="UK & Scotland Photobooth Hire for Events | Shed Photobooth">
            <meta property="og:description" content="Custom photobooth hire for festivals, weddings, Christmas markets, corporate events and brand activations across Scotland and the UK.">
            <meta property="og:url" content="{SITE}/">
            <meta property="og:image" content="{SITE}/images/hero-bg.jpg">
            <meta name="twitter:card" content="summary_large_image">
            <meta name="twitter:title" content="UK & Scotland Photobooth Hire for Events | Shed Photobooth">
            <meta name="twitter:description" content="Custom-built photobooths for festivals, weddings, Christmas markets, corporate events and brand activations.">
            <meta name="twitter:image" content="{SITE}/images/hero-bg.jpg">
            <meta name="theme-color" content="#0D0E16">
            <title>UK &amp; Scotland Photobooth Hire for Events | Shed Photobooth</title>
            <link rel="stylesheet" href="css/style.css">
            <script type="application/ld+json">
            {json.dumps(home_schema, ensure_ascii=False, indent=2)}
            </script>'''

          hire_section = '''<section class="section section--mid" id="photobooth-hire">
            <div class="container">
              <div class="reveal" style="max-width:760px;margin-bottom:3rem;">
                <span class="eyebrow">Photobooth Hire UK</span>
                <h2 class="section-title">Event Photobooth Hire<br><span>Across Scotland &amp; the UK.</span></h2>
                <p class="section-sub">Shed Photobooth supplies custom photo booth hire for events that need more than a standard booth in a corner. We build branded, festival-ready experiences for Edinburgh, Glasgow, Scotland-wide events and selected bookings across the UK.</p>
              </div>
              <div class="services-grid reveal reveal-delay-1">
                <div class="service-card"><div class="service-num">UK</div><h3 class="service-title">Photo Booth Hire</h3><p class="service-desc">Custom booth hire for weddings, private parties, corporate events, festivals and seasonal markets, with instant prints and digital galleries.</p></div>
                <div class="service-card"><div class="service-num">SCOT</div><h3 class="service-title">Scotland Event Coverage</h3><p class="service-desc">Based in Scotland and built for high-footfall events in Edinburgh, Glasgow, Murrayfield, Christmas markets, fringe venues and outdoor sites.</p></div>
                <div class="service-card"><div class="service-num">BRAND</div><h3 class="service-title">Branded Activations</h3><p class="service-desc">Bespoke exterior graphics, welcome screens, overlays and photo strip designs for launches, fan zones, sponsor areas and corporate activations.</p></div>
              </div>
            </div>
          </section>'''

          html = replace_head(read("index.html"), home_lead)
          if 'id="photobooth-hire"' not in html:
              html = html.replace('<div class="marquee-wrap">', hire_section + '\n\n<div class="marquee-wrap">', 1)
          html = html.replace('<li><a href="#">shedphotobooth.com</a></li>', f'<li><a href="{SITE}/">shedphotobooth.capturecollectives.workers.dev</a></li>')
          html = html.replace('<li><a href="#">shedphotobooth.capturecollectives.workers.dev</a></li>', f'<li><a href="{SITE}/">shedphotobooth.capturecollectives.workers.dev</a></li>')
          write("index.html", analytics(html))

          work_schema = {"@context": "https://schema.org", "@type": "CollectionPage", "name": "Shed Photobooth event work", "url": f"{SITE}/our-work.html", "description": "Recent custom photobooth installations and client logos from Shed Photobooth events across Scotland.", "isPartOf": {"@type": "WebSite", "name": "Shed Photobooth", "url": f"{SITE}/"}, "about": {"@type": "Service", "name": "Photobooth hire for events", "areaServed": ["Scotland", "United Kingdom"]}}
          work_lead = f'''  <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="See Shed Photobooth event work across Scotland: Edinburgh Fringe, Christmas markets, Murrayfield events, Scottish Rugby, Royal Highland Show and branded photobooth activations.">
            <meta name="robots" content="index,follow">
            <meta name="author" content="Capture Collective Ltd">
            <link rel="canonical" href="{SITE}/our-work.html">
            <meta property="og:type" content="website"><meta property="og:site_name" content="Shed Photobooth">
            <meta property="og:title" content="Photobooth Event Work in Scotland | Shed Photobooth">
            <meta property="og:description" content="Custom photobooth installations for festivals, markets, sports events, weddings and brand activations across Scotland and the UK.">
            <meta property="og:url" content="{SITE}/our-work.html"><meta property="og:image" content="{SITE}/images/project-fringe.jpg">
            <meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Photobooth Event Work in Scotland | Shed Photobooth">
            <meta name="twitter:description" content="See custom Shed Photobooth work for high-footfall events, Christmas markets, sports events and brand activations.">
            <meta name="twitter:image" content="{SITE}/images/project-fringe.jpg"><meta name="theme-color" content="#0D0E16">
            <title>Photobooth Event Work in Scotland | Shed Photobooth</title>
            <link rel="stylesheet" href="css/style.css">
            <script type="application/ld+json">
            {json.dumps(work_schema, ensure_ascii=False, indent=2)}
            </script>'''
          write("our-work.html", analytics(replace_head(read("our-work.html"), work_lead)))

          contact_schema = {"@context": "https://schema.org", "@type": "ContactPage", "name": "Contact Shed Photobooth", "url": f"{SITE}/contact.html", "description": "Contact Shed Photobooth for custom photobooth hire quotes across Scotland and the UK.", "mainEntity": {"@type": "Organization", "name": "Shed Photobooth", "legalName": "Capture Collective Ltd", "email": "capturecollectives@gmail.com", "url": f"{SITE}/", "areaServed": ["Scotland", "United Kingdom"]}}
          contact_lead = f'''  <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="Get a photobooth hire quote for your UK or Scotland event. Tell Shed Photobooth your date, location and event type for festivals, weddings, corporate events and markets.">
            <meta name="robots" content="index,follow"><meta name="author" content="Capture Collective Ltd">
            <link rel="canonical" href="{SITE}/contact.html"><meta property="og:type" content="website"><meta property="og:site_name" content="Shed Photobooth">
            <meta property="og:title" content="Get a Photobooth Hire Quote | Shed Photobooth"><meta property="og:description" content="Enquire about custom photobooth hire for festivals, weddings, corporate events, markets and brand activations across Scotland and the UK.">
            <meta property="og:url" content="{SITE}/contact.html"><meta property="og:image" content="{SITE}/images/logo-colour.png">
            <meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Get a Photobooth Hire Quote | Shed Photobooth"><meta name="twitter:description" content="Tell us your event date, location and event type for a tailored Shed Photobooth quote.">
            <meta name="twitter:image" content="{SITE}/images/logo-colour.png"><meta name="theme-color" content="#0D0E16">
            <title>Get a Photobooth Hire Quote | Shed Photobooth</title>
            <link rel="stylesheet" href="css/style.css">
            <script type="application/ld+json">
            {json.dumps(contact_schema, ensure_ascii=False, indent=2)}
            </script>'''
          write("contact.html", analytics(replace_head(read("contact.html"), contact_lead)))

          for rel, title, desc in [
              ("privacy.html", "Privacy Policy | Shed Photobooth", "Privacy Policy for Shed Photobooth, operated by Capture Collective Ltd in Scotland."),
              ("terms.html", "Terms & Conditions | Shed Photobooth", "Terms and Conditions for Shed Photobooth, operated by Capture Collective Ltd in Scotland.")
          ]:
              lead = f'''  <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <meta name="description" content="{desc}">
                <meta name="robots" content="index,follow">
                <link rel="canonical" href="{SITE}/{rel}">
                <title>{title}</title>
                <link rel="stylesheet" href="css/style.css">'''
              write(rel, analytics(replace_head(read(rel), lead)))

          thanks_lead = f'''  <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="robots" content="noindex,follow">
            <link rel="canonical" href="{SITE}/thank-you.html">
            <title>Thanks for Getting in Touch | Shed Photobooth</title>
            <link rel="stylesheet" href="css/style.css">'''
          write("thank-you.html", analytics(replace_head(read("thank-you.html"), thanks_lead)))

          write("robots.txt", f"User-agent: *\nAllow: /\n\nSitemap: {SITE}/sitemap.xml\n")
          write("sitemap.xml", f'''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>{SITE}/</loc><lastmod>2026-05-02</lastmod><changefreq>weekly</changefreq><priority>1.0</priority></url>
            <url><loc>{SITE}/our-work.html</loc><lastmod>2026-05-02</lastmod><changefreq>monthly</changefreq><priority>0.8</priority></url>
            <url><loc>{SITE}/contact.html</loc><lastmod>2026-05-02</lastmod><changefreq>monthly</changefreq><priority>0.9</priority></url>
            <url><loc>{SITE}/privacy.html</loc><lastmod>2026-05-02</lastmod><changefreq>yearly</changefreq><priority>0.2</priority></url>
            <url><loc>{SITE}/terms.html</loc><lastmod>2026-05-02</lastmod><changefreq>yearly</changefreq><priority>0.2</priority></url>
          </urlset>
          ''')
          write("js/analytics.js", '''// Add your GA4 Measurement ID below, for example: G-XXXXXXXXXX.
          // The tag stays dormant until a real ID is set.
          (function() {
            var GA_MEASUREMENT_ID = '';
            if (!GA_MEASUREMENT_ID || GA_MEASUREMENT_ID === 'G-XXXXXXXXXX') return;
            window.dataLayer = window.dataLayer || [];
            window.gtag = function(){ window.dataLayer.push(arguments); };
            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA_MEASUREMENT_ID);
            document.head.appendChild(script);
            window.gtag('js', new Date());
            window.gtag('config', GA_MEASUREMENT_ID);
            document.addEventListener('click', function(event) {
              var link = event.target.closest('a');
              if (!link || !window.gtag) return;
              var href = link.getAttribute('href') || '';
              var text = (link.textContent || '').trim();
              if (href.indexOf('contact.html') !== -1 || href.indexOf('mailto:') === 0) {
                window.gtag('event', 'generate_lead_click', { link_text: text, link_url: href });
              }
            });
            document.addEventListener('submit', function(event) {
              if (event.target && event.target.matches('.contact-form') && window.gtag) {
                window.gtag('event', 'generate_lead', { form_id: event.target.getAttribute('id') || 'contact-form' });
              }
            });
          })();
          ''')
          print("Applied SEO updates for Workers URL.")
          PY
      - name: Commit approved SEO updates and remove temporary workflow
        run: |
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git rm .github/workflows/codex-apply-seo-updates.yml
          git add index.html our-work.html contact.html privacy.html terms.html thank-you.html robots.txt sitemap.xml js/analytics.js
          git status --short
          git commit -m "Add SEO metadata and analytics setup"
          git push origin HEAD:main
