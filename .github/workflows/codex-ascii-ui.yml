name: Codex ASCII UI Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ascii:
    if: github.event.head_commit.message == 'Add temporary Codex ASCII cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert visible symbols to safe text
        run: |
          node <<'NODE'
          const fs = require('fs');
          const htmlFiles = fs.readdirSync('.').filter((f) => f.endsWith('.html'));
          const replacements = [
            ['©', '&copy;'], ['·', '&middot;'], ['—', '-'], ['–', '-'], ['→', '&gt;'], ['›', '&gt;'], ['✦', '*'], ['✓', 'OK'],
            ['🎪', 'Fest'], ['🎭', 'Arts'], ['🎄', 'Xmas'], ['🏟️', 'Sport'], ['💍', 'Wed'], ['🛍️', 'Market'], ['🏢', 'Corp'], ['🎉', 'Party']
          ];
          for (const f of htmlFiles) {
            let text = fs.readFileSync(f, 'utf8');
            for (const [from, to] of replacements) text = text.split(from).join(to);
            fs.writeFileSync(f, text, 'utf8');
          }
          let css = fs.readFileSync('css/style.css', 'utf8');
          css = css.replace(/[\u2500-\u257F]/g, '-').replace(/—/g, '-').replace(/→/g, '>').replace(/📷/g, 'PHOTO');
          css = css.replace(/content: 'PHOTO';/, "content: 'PHOTO';");
          fs.writeFileSync('css/style.css', css, 'utf8');
          let js = fs.readFileSync('js/main.js', 'utf8');
          js = js.replace(/[\u2500-\u257F]/g, '-').replace(/—/g, '-');
          fs.writeFileSync('js/main.js', js, 'utf8');
          fs.rmSync('.github/workflows/codex-ascii-ui.yml');
          NODE
      - name: Commit ASCII cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html our-work.html contact.html privacy.html terms.html thank-you.html css/style.css js/main.js .github/workflows/codex-ascii-ui.yml
          git commit -m "Use safe text for visible symbols"
          git push
