name: Codex Cleanup UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add temporary Codex UI cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply logo, socials, and character cleanup
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = (...codes) => String.fromCodePoint(...codes);
          const htmlFiles = fs.readdirSync('.').filter((f) => f.endsWith('.html'));
          const socialBlock = `        <div class="footer__social">\n          <a href="https://www.instagram.com/shedphotobooth/" aria-label="Instagram" target="_blank" rel="noopener">IG</a>\n          <a href="https://www.facebook.com/Shedphotobooths/" aria-label="Facebook" target="_blank" rel="noopener">FB</a>\n          <a href="https://www.tiktok.com/@shedphotobooth" aria-label="TikTok" target="_blank" rel="noopener">TT</a>\n        </div>`;
          const replacements = [
            [cp(0x00C2,0x00A9), '&copy;'], [cp(0x00C2,0x00B7), '&middot;'],
            [cp(0x00E2,0x20AC,0x201D), '-'], [cp(0x00E2,0x20AC,0x201C), '-'],
            [cp(0x00E2,0x2020,0x2019), '&gt;'], [cp(0x00E2,0x20AC,0x00BA), '&gt;'],
            [cp(0x00E2,0x0153,0x00A6), '*'], [cp(0x00E2,0x0153,0x201C), 'OK'],
            [cp(0x00F0,0x0178,0x201C,0x00B7), 'IG'], [cp(0x00E2,0x2122,0x00AA), 'TT'],
            [cp(0x00F0,0x0178,0x017D,0x00AA), 'Fest'], [cp(0x00F0,0x0178,0x017D,0x00AD), 'Arts'],
            [cp(0x00F0,0x0178,0x017D,0x201E), 'Xmas'], [cp(0x00F0,0x0178,0x008F,0x0178,0x00EF,0x00B8,0x008F), 'Sport'],
            [cp(0x00F0,0x0178,0x2019,0x008D), 'Wed'], [cp(0x00F0,0x0178,0x203A,0x008D,0x00EF,0x00B8,0x008F), 'Market'],
            [cp(0x00F0,0x0178,0x008F,0x00A2), 'Corp'], [cp(0x00F0,0x0178,0x017D,0x2030), 'Party']
          ];
          for (const f of htmlFiles) {
            let text = fs.readFileSync(f, 'utf8');
            for (const [from, to] of replacements) text = text.split(from).join(to);
            text = text.replace(/        <div class="footer__social">\r?\n[\s\S]*?        <\/div>/g, socialBlock);
            if (f === 'our-work.html') {
              text = text.replace(/\n    <!-- Testimonials -->[\s\S]*?\n    <\/div>\r?\n  <\/div>\r?\n<\/section>/, '\n  </div>\n</section>');
              text = text.replace(/<!-- [^\n]*NOTE 9:[^\n]*-->/, '<!-- Client logos -->');
              text = text.replace(/<!-- [^\n]*NOTE 2:[^\n]*-->/, '<!-- Graphics designer section -->');
            }
            if (f === 'index.html') text = text.replace(/<!-- [^\n]*IN-HOUSE DESIGN SECTION[^\n]*-->/, '<!-- In-house design section -->');
            fs.writeFileSync(f, text, 'utf8');
          }
          let css = fs.readFileSync('css/style.css', 'utf8');
          const navReplacement = `.nav__logo {\n  display: flex;\n  align-items: center;\n  text-decoration: none;\n  position: relative;\n  padding: 0;\n  border: 0;\n  border-radius: 0;\n  background: transparent;\n  box-shadow: none;\n  overflow: visible;\n}\n.nav__logo::before {\n  display: none;\n}\n.nav__logo::after {\n  content: '';\n  position: absolute;\n  left: 8%;\n  right: 14%;\n  bottom: -6px;\n  height: 1px;\n  background: rgba(255,184,0,0.68);\n  box-shadow: 0 0 10px rgba(255,184,0,0.72);\n  pointer-events: none;\n}\n@keyframes sign-sweep {\n  0%, 55% { transform: translateX(-65%); }\n  72%, 100% { transform: translateX(65%); }\n}\n.nav__logo img {\n  height: 58px;\n  width: auto;\n  max-width: 190px;\n  object-fit: contain;\n  display: block;\n  position: relative;\n  z-index: 1;\n  clip-path: inset(0 18px 0 0);\n  filter:\n    drop-shadow(0 0 2px rgba(255,255,255,0.42))\n    drop-shadow(0 0 8px rgba(255,184,0,0.55));\n}\n.footer__brand img {\n  height: 72px;\n  width: auto;\n  max-width: 220px;\n  object-fit: contain;\n  margin-bottom: 1rem;\n  display: block;\n  clip-path: inset(0 18px 0 0);\n  filter: drop-shadow(0 0 7px rgba(255,184,0,0.2));\n}\n@media (max-width: 768px) {\n  .nav__logo { padding: 0; }\n  .nav__logo img { height: 46px; max-width: 150px; }\n}\n.nav__logo-text {`;
          css = css.replace(/\.nav__logo \{[\s\S]*?\.nav__logo-text \{/, navReplacement);
          css = css.replace(/\.btn-arrow::after \{[^}]*\}/, ".btn-arrow::after { content: '>'; font-size: 1rem; }");
          css = css.replace(/\.event-icon \{[\s\S]*?\n\}/, `.event-icon {\n  font-size: 0.72rem;\n  margin-bottom: 1rem;\n  display: block;\n  color: var(--amber);\n  font-weight: 800;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n}`);
          css = css.replace(/\.footer__social a \{[\s\S]*?\n\}/, `.footer__social a {\n  width: 36px; height: 36px;\n  border: 1px solid var(--border-med);\n  border-radius: var(--radius);\n  display: flex; align-items: center; justify-content: center;\n  font-size: 0.72rem;\n  font-weight: 800;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  transition: border-color var(--transition), color var(--transition);\n}`);
          css = css.replace(/content: '\uD83D\uDCF7';/, "content: 'PHOTO';");
          css = css.replace(/[\u2500-\u257F]/g, '-').replace(/\u2014/g, '-').replace(/\u2192/g, '>');
          fs.writeFileSync('css/style.css', css, 'utf8');
          let js = fs.readFileSync('js/main.js', 'utf8');
          js = js.replace(/[\u2500-\u257F]/g, '-').replace(/\u2014/g, '-');
          fs.writeFileSync('js/main.js', js, 'utf8');
          fs.rmSync('.github/workflows/codex-cleanup-ui.yml');
          NODE
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html our-work.html contact.html privacy.html terms.html thank-you.html css/style.css js/main.js .github/workflows/codex-cleanup-ui.yml
          git commit -m "Clean up logo, socials, and broken characters"
          git push
